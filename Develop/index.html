<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Employee Payroll Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="wrapper">
    <header>
      <h1>Employee Payroll Tracker</h1>
    </header>
    <div class="card">
      <div class="card-header">
       <h2>Employee Roster</h2>
      </div>
      <div class="card-body">
       <table table="employee-table">
        <thead>
          <tr>
            <td>First Name</td>
            <td>Last Name</td>
            <td>Salary</td>
          </tr>
          <br>
        </thead>
        <tbody id="employee-table">
        </tbody>
       </table>
      </div>
      <div class="card-footer">
        <button id="add-employees-btn" class="btn">Add</button>
        <button id="calculate-salary-btn" class="btn">Calculate</button>
        <button id="clear-employees-btn" class="btn">Clear</button>
        <button id="gnerate-random-employee-btn" class="btn">Generate</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
